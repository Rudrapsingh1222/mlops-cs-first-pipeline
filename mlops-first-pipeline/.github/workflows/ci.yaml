#Github actions workflow
#Github automatically looks for workflow file inside .github/workflows/
#give workflow a name
name: Iris ML API- CI Pipeline  
#define when github should run the workflow
on:
# run workflow on push or pull request events but only for the main branch
  push:
    branches:
      - main 
  pull_request:
    branches:
      - main

#permissions for the workflow are restricted to reading the repo content only
permissions:
  contents: read
#define the jobs  that make up the pipeline
jobs:
  test-and-build:
  #github provides a fresh Ubintu VM for this job
    runs-on: ubuntu-latest
      #steps
    steps:
    #download the repo content to the runner
    - name: Checkout repository
      uses: actions/checkout@v4
    #Install python on runner
    - name: Install Python on Runner
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    -name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    -name: Run automated tests
     run: python -m pytest -v
    -name: Build Docker image
     run: docker build -t iris-ml-api:&{{github.sha}} .